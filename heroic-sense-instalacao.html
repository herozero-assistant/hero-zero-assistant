<style>
:root{--bg:#0b0d12;--navy:#0d1a2e;--navy2:#102139;--card:#14263f;--line:#233b5c;--text:#e6edf7;--muted:#a7b5cb;--cyan:#42c9ef;--blue:#1676eb;--teal:#28c8ba;--grad:linear-gradient(120deg,#42c9ef,#1676eb 55%,#28c8ba)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#1676eb30,transparent 70%),var(--navy);color:var(--text);font:16px/1.65 'DM Sans',Arial,sans-serif}
a{color:var(--cyan)}
.shell{width:min(980px,calc(100% - 32px));margin:auto}
header{position:sticky;top:0;z-index:5;background:#0b0d12e8;backdrop-filter:blur(14px);border-bottom:1px solid #1c2130}
.nav{display:flex;align-items:center;gap:16px;min-height:68px}
.brand{display:inline-flex;align-items:center;gap:9px;color:#fff;font:800 21px Manrope,sans-serif;letter-spacing:-.8px;text-decoration:none}
.brand img{width:36px;height:36px}
.brand strong{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font:inherit}
.nav-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
select{padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--navy);color:var(--text);font:700 13px 'DM Sans',sans-serif}
.button{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:12px 20px;border:1px solid transparent;border-radius:11px;font-weight:700;text-decoration:none;cursor:pointer;font-size:15px}
.button-primary{background:var(--grad);color:#fff;box-shadow:0 8px 26px #1676eb4d}
.button-primary:hover{box-shadow:0 12px 34px #1676eb70}
.button-ghost{border-color:#2a3a55;background:#121a29;color:var(--text)}
.button-ghost:hover{border-color:var(--cyan)}
.hero{padding:56px 0 30px}
.eyebrow{margin:0 0 12px;color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
h1,h2,h3{font-family:Manrope,sans-serif;letter-spacing:-.04em;line-height:1.15;color:#fff}
h1{font-size:clamp(32px,4.4vw,50px);margin:0 0 14px}
.lead{color:var(--muted);font-size:18px;max-width:720px;margin:0 0 24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px;padding:0;list-style:none}
.chips li{padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--navy2);color:#c9cfdb;font-size:13px;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.steps{display:grid;gap:16px;margin:26px 0 0;padding:0;list-style:none;counter-reset:step}
.step{position:relative;display:grid;grid-template-columns:52px 1fr;gap:16px;padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.step:before{counter-increment:step;content:counter(step);display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--grad);color:#fff;font:800 19px Manrope,sans-serif}
.step h3{margin:6px 0 6px;font-size:20px}
.step p{margin:0 0 10px;color:var(--muted)}
.step p:last-child{margin-bottom:0}
kbd,code{padding:2px 7px;border:1px solid #2a3a55;border-radius:6px;background:#0d1a2e;color:#e8eaf0;font:600 13px Consolas,monospace}
.copy-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.copy{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid #2a3a55;border-radius:9px;background:#0d1a2e;color:#e8eaf0;font:600 14px Consolas,monospace;cursor:pointer}
.copy:hover{border-color:var(--cyan)}
.copy span{font:700 11px 'DM Sans',sans-serif;color:var(--cyan);text-transform:uppercase;letter-spacing:.06em}
.mock{margin-top:12px;max-width:560px;border:1px solid #2a3142;border-radius:12px;background:#1f2127;overflow:hidden;box-shadow:0 14px 30px #0006}
.mock-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#2a2d34;color:#e8eaf0;font-size:13px}
.mock-bar b{font-weight:700}
.toggle{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:13px}
.switch{width:34px;height:18px;border-radius:99px;background:#8ab4f8;position:relative}
.switch:after{content:"";position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#1a73e8}
.mock-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.mock-btn{padding:6px 12px;border:1px solid #5f6368;border-radius:6px;color:#8ab4f8;font-size:13px;font-weight:600}
.mock-btn.hl{border-color:#ffb547;box-shadow:0 0 0 3px #ffb54755;color:#ffd27a}
.ring{outline:3px solid #ffb547;outline-offset:3px;border-radius:99px}
.folder{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#e8eaf0;font-size:13px}
.folder i{display:inline-block;width:22px;height:16px;border-radius:3px;background:#f2c14e}
.folder em{margin-left:auto;color:#9aa3b5;font-style:normal}
.shot{margin:16px 0 0;padding:0;border:1px solid #2a3142;border-radius:14px;overflow:hidden;background:#0f1218;box-shadow:0 24px 60px #0008}
.shot img{display:block;width:100%;height:auto}
.shot figcaption{padding:10px 14px;color:var(--muted);font-size:13px}
.section{padding:40px 0}
.help{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.help article{padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.help h3{margin:0 0 6px;font-size:17px}
.help p{margin:0;color:var(--muted);font-size:14.5px}
.safe{display:flex;gap:12px;padding:16px 18px;border:1px solid #2f5a44;border-radius:14px;background:#13211a;color:#bff0d6}
.risk{display:flex;gap:12px;margin-top:14px;padding:16px 18px;border:1px solid #6b5420;border-left:4px solid #ffb547;border-radius:14px;background:#2a2312;color:#f2e2bd}
.safe strong,.risk strong{display:block;color:#fff}
footer{margin-top:30px;padding:28px 0;border-top:1px solid var(--line);background:var(--bg);color:#9aa3b5;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 16px;border-radius:10px;background:#13211a;border:1px solid #2f5a44;color:#9fe8c3;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:720px){.step{grid-template-columns:1fr;padding:18px}.help{grid-template-columns:1fr}.hero{padding-top:36px}.nav-actions .button{display:none}}
</style>

const locales = { pt:'pt-BR', en:'en', pl:'pl', el:'el', de:'de', fr:'fr' };
let lang = 'en';
try {
  const stored = localStorage.getItem('boltmind-language');
  if (T[stored]) lang = stored;
  else { const n = (navigator.language || '').slice(0, 2).toLowerCase(); if (T[n]) lang = n; }
} catch {}
const select = document.getElementById('language');
function render() {
  const t = T[lang];
  document.documentElement.lang = locales[lang];
  document.title = t.pageTitle + ' — BoltMind Heroic Sense';
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t] || ''; });
  select.value = lang;
}
select.addEventListener('change', () => { lang = select.value; try { localStorage.setItem('boltmind-language', lang); } catch {} render(); });
const toast = document.getElementById('toast');
document.querySelectorAll('[data-copy]').forEach(button => button.addEventListener('click', () => {
  const text = button.dataset.copy;
  const done = () => { toast.textContent = T[lang].copied; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2200); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done); else done();
}));
document.querySelectorAll('.heroic-download').forEach(link => link.addEventListener('click', () => {
  fetch('https://script.google.com/macros/s/AKfycbwMpL8V_pOIsrP1BnEhPX7HkYhUQf04gm7WVGTMTGaTWYQUxdriC7m5RvHgQyGjdgqz/exec?download=heroic-sense', { method:'GET', mode:'no-cors', cache:'no-store', keepalive:true }).catch(() => {});
}));
render();
})();
